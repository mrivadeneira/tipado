[project]
name = "tipado"
version = "0.1.0"
description = "Prueba tipado python"
authors = [
    {name = "Maximiliano Rivadeneira",email = "maxirivadeneira92@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mypy (>=2.3.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
